name: release-preview

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing vX.Y.Z tag to verify and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-preview-${{ github.event.inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release_sha: ${{ steps.tag.outputs.release_sha }}
    steps:
      - name: Resolve the immutable release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must be stable SemVer vX.Y.Z: $RELEASE_TAG" >&2
            exit 1
          fi

          read -r object_type object_sha < <(gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" \
            --jq '.object | [.type, .sha] | @tsv')
          if [[ "$object_type" == "tag" ]]; then
            release_sha="$(gh api \
              "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}" \
              --jq '.object.sha')"
          elif [[ "$object_type" == "commit" ]]; then
            release_sha="$object_sha"
          else
            echo "Unsupported tag target type for $RELEASE_TAG: $object_type" >&2
            exit 1
          fi
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"

  verify:
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.release_sha }}
      - name: Verify tag commit belongs to main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_sha="$(git rev-parse HEAD)"
          comparison_status="$(gh api \
            "repos/${GITHUB_REPOSITORY}/compare/${release_sha}...main" \
            --jq '.status')"
          case "$comparison_status" in
            identical|ahead) ;;
            *)
              echo "Tag commit is not reachable from main: ${comparison_status}" >&2
              exit 1
              ;;
          esac
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.21.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22.23.1
          cache: pnpm
      - name: Verify changelog release-note support
        run: |
          set -euo pipefail
          if [[ ! -f CHANGELOG.md ]]; then
            echo "Tag $RELEASE_TAG predates CHANGELOG-based release recovery and cannot use this workflow." >&2
            exit 1
          fi
          release_notes="$(node scripts/verify-release-tag.mjs "$RELEASE_TAG" --notes)"
          if [[ "$release_notes" != "# Tool Bridge Mobile ${RELEASE_TAG}"* ]]; then
            echo "Tag $RELEASE_TAG predates CHANGELOG-based release recovery and cannot use this workflow." >&2
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:release-tag "$RELEASE_TAG"
      - run: pnpm verify
      - run: pnpm peers check
      - run: pnpm audit:dependencies

  android-preview-apk:
    needs:
      - resolve
      - verify
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.release_sha }}
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.21.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22.23.1
          cache: pnpm
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: 17
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:doctor
      - run: pnpm build:android:preview
      - name: Prepare versioned preview APK
        run: |
          set -euo pipefail
          release_apk="tool-bridge-mobile-preview-${RELEASE_TAG}.apk"
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk "artifacts/${release_apk}"
          (
            cd artifacts
            sha256sum "$release_apk" > "${release_apk}.sha256"
          )
      - name: Upload versioned preview APK
        uses: actions/upload-artifact@v7.0.1
        with:
          name: tool-bridge-mobile-preview-apk-${{ env.RELEASE_TAG }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  ios-simulator:
    needs:
      - resolve
      - verify
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.release_sha }}
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.21.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: sudo xcode-select -s /Applications/Xcode_26.4.1.app/Contents/Developer
      - run: xcodebuild -version
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:doctor
      - run: pnpm build:ios:sim

  publish-github-prerelease:
    needs:
      - resolve
      - android-preview-apk
      - ios-simulator
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.release_sha }}
      - uses: actions/download-artifact@v8.0.1
        with:
          name: tool-bridge-mobile-preview-apk-${{ env.RELEASE_TAG }}
          path: artifacts
      - name: Extract latest changelog
        run: node scripts/verify-release-tag.mjs "$RELEASE_TAG" --notes > release-notes.md
      - name: Publish or repair tagged GitHub Pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_apk="artifacts/tool-bridge-mobile-preview-${RELEASE_TAG}.apk"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              "$release_apk" \
              "${release_apk}.sha256" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Tool Bridge Mobile ${RELEASE_TAG} (Preview)" \
              --notes-file release-notes.md \
              --draft=false \
              --prerelease \
              --verify-tag
          else
            gh release create "$RELEASE_TAG" \
              "$release_apk" \
              "${release_apk}.sha256" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Tool Bridge Mobile ${RELEASE_TAG} (Preview)" \
              --notes-file release-notes.md \
              --prerelease \
              --latest=false \
              --verify-tag
          fi
