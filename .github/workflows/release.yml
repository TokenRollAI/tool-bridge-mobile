name: release-preview

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify tag commit belongs to main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          comparison_status="$(gh api \
            "repos/${GITHUB_REPOSITORY}/compare/${GITHUB_SHA}...main" \
            --jq '.status')"
          case "$comparison_status" in
            identical|ahead) ;;
            *)
              echo "Tag commit is not reachable from main: ${comparison_status}" >&2
              exit 1
              ;;
          esac
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.21.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:release-tag "$GITHUB_REF_NAME"
      - run: pnpm verify
      - run: pnpm peers check
      - run: pnpm audit:dependencies

  android-preview-apk:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.21.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22.23.1
          cache: pnpm
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: 17
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:doctor
      - run: pnpm build:android:preview
      - name: Prepare versioned preview APK
        run: |
          set -euo pipefail
          release_apk="tool-bridge-mobile-preview-${GITHUB_REF_NAME}.apk"
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk "artifacts/${release_apk}"
          sha256sum "artifacts/${release_apk}" > "artifacts/${release_apk}.sha256"
      - name: Upload versioned preview APK
        uses: actions/upload-artifact@v7.0.1
        with:
          name: tool-bridge-mobile-preview-apk-${{ github.ref_name }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  ios-simulator:
    needs: verify
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.21.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: sudo xcode-select -s /Applications/Xcode_26.4.1.app/Contents/Developer
      - run: xcodebuild -version
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:doctor
      - run: pnpm build:ios:sim

  publish-github-prerelease:
    needs:
      - android-preview-apk
      - ios-simulator
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          name: tool-bridge-mobile-preview-apk-${{ github.ref_name }}
          path: artifacts
      - name: Publish tagged GitHub Pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_apk="artifacts/tool-bridge-mobile-preview-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" \
            "$release_apk" \
            "${release_apk}.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Tool Bridge Mobile ${GITHUB_REF_NAME} (Preview)" \
            --notes-file "docs/releases/${GITHUB_REF_NAME}.md" \
            --prerelease \
            --latest=false \
            --verify-tag
