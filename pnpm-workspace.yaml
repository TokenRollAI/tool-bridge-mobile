packages: []

# eslint-import-resolver-typescript 的 MIT 原生 resolver 已通过平台可选包提供；
# 禁止其 postinstall 在 clean install 时执行额外修复/下载逻辑。
allowBuilds:
  unrs-resolver: false

patchedDependencies:
  image-size@1.2.1: patches/image-size@1.2.1.patch

# GHSA 对应的修复版本 2.0.3 尚未发布，且 Metro 仍要求 image-size 1.x。
# 下列豁免仅在 patches/image-size@1.2.1.patch 与恶意样本验证同时存在时成立。
audit:
  level: high
  ignore:
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-5p2g-fcmc-qvqq

strictPeerDependencies: true

# 0.11.0 是本仓库等待的官方 React Native device 入口；已核对 registry tarball、上游源码/测试、
# 精确 integrity、MIT license、双端 Metro 与本地 consumer contract，因此允许在默认 release-age
# 等待期内使用这一精确版本。升级版本不会继承此例外。
minimumReleaseAgeExclude:
  - '@tool-bridge/sdk@0.11.0'
